name: Update Social Preview

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/preview/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Install Playwright
        run: |
          npm install --prefix /tmp/pw-runner --no-save playwright
          /tmp/pw-runner/node_modules/.bin/playwright install chromium

      - name: Generate preview screenshots
        env:
          NODE_PATH: /tmp/pw-runner/node_modules
          PORT: '8765'
          PREVIEW_TARGET_URL: http://127.0.0.1:8765
          PREVIEW_OUT_DIR: docs/preview
          PREVIEW_BADGE: "LIVE DEMO · CLOUD RUN"
          PREVIEW_TITLE: "Basilico — Rapallo"
          PREVIEW_DESC: "Offerte e volantini dei supermercati di Rapallo in tempo reale con cache SQLite, resilienza offline e sfogliatore mobile-first."
          PREVIEW_TAGS: "React 19,Vite,Node.js,SQLite,Docker"
          PREVIEW_REPO: "github.com/Noobucodonosor/basilico"
          PREVIEW_LIVE_URL: "https://basilico-txfxsxuuma-ew.a.run.app"
          PREVIEW_THEME: "green"
        run: |
          node server.js >/tmp/basilico.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765 >/dev/null && break
            sleep 0.5
          done
          node .github/scripts/generate-preview.mjs

      - name: Commit and push updated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/preview/desktop.png docs/preview/mobile.png docs/preview/social-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "chore(preview): auto-update social preview [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No preview changes detected."
          fi
